name: Release Package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build RAIV.exe
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --name RAIV --icon assets/app_icon.ico --add-data "assets;assets" --add-data "tools;tools" --add-data "README.md;." --add-data "LICENSE;." --collect-all PySide6 raiv.py
          if (Test-Path "register_raiv_file_association.ps1") {
            Copy-Item "register_raiv_file_association.ps1" "dist/RAIV/register_raiv_file_association.ps1" -Force
          }

      - name: Build package
        shell: pwsh
        run: |
          $outDir = "dist"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          Compress-Archive -Path "dist/RAIV/*" -DestinationPath "$outDir/RAIV-windows-exe.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RAIV-windows-exe
          path: dist/RAIV-windows-exe.zip

      - name: Upload release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/RAIV-windows-exe.zip
